; ============================================================
;  PillPal Firmware — PlatformIO Configuration
;  Target  : ESP32 WROOM-32
;  Platform: pioarduino 51.03.03
;            → Arduino Core 3.0.2 / ESP-IDF 5.1.4
;  Framework: Arduino
;
;  BREAKING CHANGES vs old espressif32 @ ^6.6.0 (Core 2.x):
;    - LEDC: ledcSetup/ledcAttachPin removed → ledcAttach(pin,freq,res)
;    - AsyncTCP/ESPAsyncWebServer: use ESP32Async forks, not esphome forks
;    - analogSetAttenuation(): global form removed → per-pin only
;    - esp_task_wdt_init(): now takes esp_task_wdt_config_t struct
;  All of the above are already fixed in this firmware.
; ============================================================

[platformio]
default_envs = pillpal

; ── Common settings shared across all envs ──────────────────
[env]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize, time
monitor_echo    = yes   ; Shows what you type in the terminal
monitor_eol     = LF    ; Sends the \n character when you press Enter

lib_ldf_mode = chain    ; 'chain' is recommended for ESP32Async libs

lib_deps =
    ; OLED display — SH1106 1.3" via I2C
    adafruit/Adafruit SH110X @ ^2.1.11
    adafruit/Adafruit GFX Library @ ^1.11.9

    ; RTC — DS3231 high-precision I2C clock
    adafruit/RTClib @ ^2.1.4

    ; Async web server — ESP32Async forks, compatible with Core 3.x
    ; NOTE: do NOT use esphome/AsyncTCP-esphome or esphome/ESPAsyncWebServer-esphome
    ;       those are built for Core 2.x and break on Core 3.x / ESP-IDF 5.1
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.7.1

    ; ArduinoJson v7 — REST API serialization
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -D MONITOR_SPEED=115200

    ; ESP32 core debug level: 0=None 1=Error 2=Warn 3=Info 4=Debug 5=Verbose
    -D CORE_DEBUG_LEVEL=1

    ; Required by ESP32Async libs on Core 3.x to avoid config warnings
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_STACK_SIZE=4096

    ; Loop stack — increase if stack overflows appear in monitor
    -D CONFIG_ARDUINO_LOOP_STACK_SIZE=8192

    ; Suppress harmless warnings from vendor headers
    -Wno-unused-variable
    -Wno-unused-parameter

; ── Development build (default) ─────────────────────────────
[env:pillpal]
build_type  = debug
build_flags =
    ${env.build_flags}
    -D PILLPAL_DEBUG=1
    -D PILLPAL_VERSION=\"1.0.0-dev\"

; ── Release / production build ──────────────────────────────
[env:pillpal_release]
build_type  = release
build_flags =
    ${env.build_flags}
    -D PILLPAL_VERSION=\"1.0.0\"
    -Os